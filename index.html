<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맹그린 꾸미기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6f1e4;
    --cream-2:#eee6d2;
    --card:#ffffff;
    --green-1:#dcecc2;
    --green-2:#a1c661;
    --green-3:#7ba63f;
    --green-deep:#4f7a2c;
    --tan:#d5ad93;
    --brown:#976f57;
    --brown-dark:#6b4d3a;
    --coral:#e2637a;
    --coral-dark:#c94f6a;
    --gold:#e8b84b;
    --ink:#3a3324;
    --ink-soft:#6b6252;
    --line:#e3dcc8;
    --shadow: 0 10px 24px rgba(107, 77, 58, 0.14);
  }
  :root:not([data-theme="light"]){
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#1b2016;
      --cream-2:#232a1c;
      --card:#262d1f;
      --green-1:#33421f;
      --green-2:#8fb455;
      --green-3:#9bcf5c;
      --green-deep:#c7e6a0;
      --tan:#caa084;
      --brown:#b08867;
      --brown-dark:#e7d5c3;
      --coral:#ef7d92;
      --coral-dark:#ffb0bf;
      --gold:#f0c866;
      --ink:#f1ecdd;
      --ink-soft:#c9c2ac;
      --line:#3a4230;
      --shadow: 0 10px 26px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --cream:#1b2016;
    --cream-2:#232a1c;
    --card:#262d1f;
    --green-1:#33421f;
    --green-2:#8fb455;
    --green-3:#9bcf5c;
    --green-deep:#c7e6a0;
    --tan:#caa084;
    --brown:#b08867;
    --brown-dark:#e7d5c3;
    --coral:#ef7d92;
    --coral-dark:#ffb0bf;
    --gold:#f0c866;
    --ink:#f1ecdd;
    --ink-soft:#c9c2ac;
    --line:#3a4230;
    --shadow: 0 10px 26px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--cream);
    color: var(--ink);
    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 28px 14px 60px;
  }
  .app{
    width:100%;
    max-width:460px;
  }
  h1,h2,.title-font{
    font-family:'Jua','Gowun Dodum',sans-serif;
    font-weight:400;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  header h1{
    font-size:26px;
    color:var(--green-deep);
    margin:0;
  }
  header p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .donation-badge{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 14px;
    box-shadow:var(--shadow);
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    text-align:right;
    line-height:1.3;
    cursor:pointer;
    user-select:none;
  }
  .donation-badge b{
    display:block;
    font-family:'Jua',sans-serif;
    font-size:15px;
    color:var(--coral-dark);
  }

  .stage-card{
    background:var(--card);
    border-radius:28px;
    padding:16px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio: 521 / 496;
    border-radius:20px;
    overflow:hidden;
    isolation:isolate;
  }

  .stage-bg{
    position:absolute;
    inset:0;
    transition: background 0.4s ease;
  }
  .bg-forest{ background: radial-gradient(120% 100% at 50% 100%, var(--green-1) 0%, #cfe6ab 45%, #bcdb95 100%); }
  .bg-sunset{ background: linear-gradient(180deg, #ffd9a0 0%, #ffb98c 45%, #f28f82 100%); }
  .bg-fireflynight{ background: #002b4b; }
  .bg-space{ background: radial-gradient(120% 90% at 50% 100%, #2c2150 0%, #1a1440 55%, #0c0a24 100%); }

  .deco{ position:absolute; inset:0; overflow:hidden; }
  .deco span{ position:absolute; border-radius:50%; }

  .bg-forest .cloud{
    background: rgba(255,255,255,0.55);
    width:26%; height:10%; border-radius:40px;
    top:10%;
  }
  .bg-forest .cloud.c1{ left:8%; }
  .bg-forest .cloud.c2{ left:56%; top:18%; width:20%; height:8%;}

  .bg-sunset .sun{
    width:34%; height:34%; left:33%; top:8%;
    background: radial-gradient(circle, #fff6d8 0%, #ffd873 60%, rgba(255,216,115,0) 72%);
  }
  .bg-sunset .wave{
    left:-10%; width:120%; height:14%; bottom:4%;
    background: rgba(255,255,255,0.35);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }

  .twinkle{
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,250,170,1) 0%, rgba(223,220,20,0.95) 20%, rgba(223,220,20,0.4) 45%, rgba(223,220,20,0) 72%);
    animation: firefly-pulse 3.2s ease-in-out infinite;
  }
  @keyframes firefly-pulse{
    0%,100%{ opacity:0.82; transform:scale(0.92);}
    50%{ opacity:1; transform:scale(1.06);}
  }
  .star{
    background: #ffffff;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.25; transform:scale(0.7);}
    50%{ opacity:1; transform:scale(1);}
  }

  .char-layer{
    position:absolute; inset:0;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .char-layer img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:contain;
    filter: drop-shadow(0 10px 10px rgba(60,40,20,0.18));
  }
  .stage.spinning .char-layer{
    animation: spinWobble 0.15s ease-in-out infinite;
  }
  @keyframes spinWobble{
    0%{ transform: scaleX(1) rotate(0deg);}
    50%{ transform: scaleX(0.86) rotate(-1.5deg);}
    100%{ transform: scaleX(1) rotate(0deg);}
  }

  .accessory{
    position:absolute;
    transform: translate(-50%,-50%);
    filter: drop-shadow(0 4px 6px rgba(60,40,20,0.2));
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none;
  }
  .accessory svg{ width:100%; height:100%; display:block; }
  .stage.overlays-hidden .accessory{ opacity:0; }

  .floaty{ animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{ margin-top:0px; }
    50%{ margin-top:-8px; }
  }

  #celebrateLayer{ position:absolute; inset:0; pointer-events:none; overflow:visible; }

  .stage.celebrate .char-layer img{
    animation: celebrate-bounce 0.9s ease-in-out;
    transform-origin: 50% 88%;
  }
  @keyframes celebrate-bounce{
    0%,100%{ transform: scale(1) rotate(0deg); }
    18%{ transform: scale(1.06) rotate(-5deg); }
    36%{ transform: scale(1.1) rotate(5deg); }
    54%{ transform: scale(1.06) rotate(-4deg); }
    72%{ transform: scale(1.03) rotate(3deg); }
    88%{ transform: scale(1.01) rotate(-1deg); }
  }

  .celebrate-puff{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle, #fbffe8 0%, #d9f0a8 35%, #a1c661 68%, rgba(161,198,97,0) 100%);
    opacity:0;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.55));
    transform: translate(-50%,-50%) scale(0.3);
    animation: puff-float 0.9s ease-out forwards;
  }
  @keyframes puff-float{
    0%{ opacity:0; transform: translate(-50%,-50%) scale(0.2); }
    22%{ opacity:1; transform: translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform: translate(-50%,-190%) scale(1.6); }
  }

  .celebrate-heart{
    position:absolute;
    width:10%;
    aspect-ratio:1;
    opacity:0;
    pointer-events:none;
  }
  .celebrate-heart svg{ width:100%; height:100%; display:block; }

  .stage-controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .ctrl-btn{
    flex:1 1 28%;
    min-width:96px;
    border:none;
    background: var(--green-1);
    color: var(--green-deep);
    font-family:'Jua',sans-serif;
    font-size:13.5px;
    padding:10px 6px;
    border-radius:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    transition: transform 0.12s ease;
  }
  .ctrl-btn:active{ transform: scale(0.96); }
  .ctrl-btn:disabled{ opacity:0.6; }
  .ctrl-btn.secondary{
    background: var(--cream-2);
    color: var(--ink-soft);
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin:20px 0 12px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-family:'Gowun Dodum',sans-serif;
    font-size:13.5px;
    padding:9px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    display:flex; align-items:center; gap:5px;
  }
  .tab-btn.active{
    background: var(--green-3);
    border-color: var(--green-3);
    color:#fff;
  }

  .item-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }
  .item-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px 6px 8px;
    text-align:center;
    cursor:pointer;
    position:relative;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .item-card:active{ transform: scale(0.96); }
  .item-card.selected{
    border-color: var(--coral);
    box-shadow: 0 0 0 2px var(--coral) inset;
  }
  .item-thumb{
    width:100%;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
  }
  .item-thumb svg, .item-thumb .bg-swatch{ width:78%; height:78%; }
  .bg-swatch{ border-radius:10px; }
  .item-name{
    font-size:11.5px;
    color:var(--ink);
    line-height:1.3;
    min-height:2.4em;
  }
  .price-tag{
    font-size:10.5px;
    color:var(--coral-dark);
    font-weight:bold;
    margin-top:2px;
  }
  .lock-badge{
    position:absolute;
    top:6px; right:6px;
    background: var(--brown-dark);
    color:#fff;
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
  }
  .upload-placeholder{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    border:2px dashed var(--line);
    border-radius:10px;
    font-size:22px;
    color:var(--ink-soft);
    background:var(--cream-2);
  }

  footer{
    margin-top:22px;
    text-align:center;
    font-size:11.5px;
    color: var(--ink-soft);
    line-height:1.6;
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(30,25,15,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-box{
    background:var(--card);
    border-radius:22px;
    padding:22px 20px 20px;
    max-width:320px;
    width:100%;
    text-align:center;
    box-shadow: var(--shadow);
  }
  .modal-box .modal-thumb{
    width:88px; height:88px;
    margin:0 auto 10px;
  }
  .modal-thumb svg, .modal-thumb img, .modal-thumb .bg-swatch{
    width:100%; height:100%;
    display:block;
    object-fit:contain;
  }
  .modal-box h3{
    font-family:'Jua',sans-serif;
    font-weight:400;
    font-size:18px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .modal-box p{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 16px;
    line-height:1.5;
  }
  .modal-price{
    font-family:'Jua',sans-serif;
    font-size:22px;
    color:var(--coral-dark);
    margin-bottom:16px;
  }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions button{
    flex:1;
    border:none;
    padding:12px 8px;
    border-radius:14px;
    font-family:'Jua',sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .btn-confirm{ background:var(--coral); color:#fff; }
  .btn-cancel{ background:var(--cream-2); color:var(--ink-soft); }

  .toast{
    position:absolute;
    left:50%; bottom:4%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(58,45,30,0.92);
    color:#fff;
    padding:9px 14px;
    border-radius:16px;
    font-size:12px;
    max-width:94%;
    white-space:nowrap;
    text-align:center;
    line-height:1.4;
    opacity:0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    z-index:20;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1>맹그린 꾸미기</h1>
      <p>맹그린과 함께 맹그로브 숲을 지켜줘</p>
    </div>
    <div class="donation-badge" id="donationBadge"></div>
  </header>

  <div class="stage-card">
    <div class="stage" id="stage">
      <div class="stage-bg bg-forest" id="stageBg">
        <div class="deco" id="stageDeco"></div>
      </div>
      <div class="char-layer">
        <img id="charImg" src="" alt="맹그린 캐릭터">
      </div>
      <div id="accessoryLayer"></div>
      <div id="celebrateLayer"></div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="stage-controls">
      <button class="ctrl-btn" id="spinBtn">🔄 뒤돌아보기</button>
      <button class="ctrl-btn" id="shareBtn">📤 공유하기</button>
      <button class="ctrl-btn secondary" id="resetBtn">🌱 초기화</button>
    </div>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <div class="item-grid" id="itemGrid"></div>
  <input type="file" id="customFileInput" accept="image/*" style="display:none">

  <footer>
    맹그린 캐릭터 ⓒ 환경재단 · 이 화면은 클로드 코드 스터디용 프로토타입이에요.<br>
    실제 결제 없이 후원 · 잠금해제 흐름만 시뮬레이션합니다.
  </footer>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-thumb" id="modalThumb"></div>
    <h3 id="modalTitle">아이템 이름</h3>
    <p id="modalDesc">이 아이템은 맹그로브 숲을 지키는 데 쓰이는 후원으로 잠금 해제할 수 있어요.</p>
    <div class="modal-price" id="modalPrice">3,000원</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">다음에요</button>
      <button class="btn-confirm" id="modalConfirm">후원 페이지 열기</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="shareOverlay">
  <div class="modal-box">
    <img id="shareImg" alt="맹그린 꾸미기 결과" style="width:100%;border-radius:16px;display:block;margin-bottom:12px;">
    <p style="margin:0 0 16px;">이미지를 길게 눌러서 저장하거나 공유해보세요.</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="shareCloseBtn">닫기</button>
      <button class="btn-confirm" id="shareDownloadBtn">다운로드</button>
    </div>
  </div>
</div>

function makeFireflies(){
  // bigger, bolder glows in the transparent margins around the character
  const flies = [
    {left:90, top:10, size:28},
    {left:8, top:16, size:17},
    {left:50, top:95, size:15},
    {left:10, top:90, size:20},
    {left:90, top:90, size:20}
  ];
  return flies.map((f,i)=>`<span class="twinkle" style="left:${f.left}%; top:${f.top}%; width:${f.size}%; aspect-ratio:1; animation-delay:${(i*0.4).toFixed(2)}s; transform:translate(-50%,-50%);"></span>`).join('');
}
function makeDots(n, cls){
  let s='';
  for(let i=0;i<n;i++){
    const top = 6 + Math.random()*70;
    const left = 4 + Math.random()*92;
    const size = 3 + Math.random()*5;
    const delay = (Math.random()*2.4).toFixed(2);
    s += `<span class="${cls}" style="top:${top}%; left:${left}%; width:${size}px; height:${size}px; animation-delay:${delay}s;"></span>`;
  }
  return s;
}

const DONATION_KEY = 'mg_donation_until_v1';
function getDonationUntil(){
  try{ return parseInt(localStorage.getItem(DONATION_KEY) || '0', 10) || 0; }

function onItemClick(item){
  if(item.price>0 && !isDonationActive()){
    openModal(item);
    return;
  }
  if(item.isCustomSlot){
    triggerCustomUpload(item);
    return;
  }
  if(item.cat==='bg'){
    state.bg = item.id;
    showToast(pickQuote(EQUIP_QUOTES));
  } else {
    const turningOn = state.equipped[item.cat] !== item.id;
    state.equipped[item.cat] = turningOn ? item.id : null;
    if(turningOn) showToast(pickQuote(EQUIP_QUOTES));
  }
  renderStage();
  renderGrid();
}

function triggerCustomUpload(item){
  state.pendingUploadItem = item;
  customFileInput.click();
}

customFileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  const item = state.pendingUploadItem;
  e.target.value = '';
  if(!file || !item) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    if(item.cat==='bg'){
      item.customBgUrl = reader.result;
      state.bg = item.id;
    } else {
      item.customImg = reader.result;
      state.equipped[item.cat] = item.id;
    }
    renderStage();
    renderGrid();
    playCelebration();
    showToast(pickQuote(UPLOAD_QUOTES));
  };
  reader.readAsDataURL(file);
});

  accessoryLayer.innerHTML = '';

    if(facingIsBack() && (cat==='glasses' || cat==='neck')) return; // not visible from behind

const modalOverlay = document.getElementById('modalOverlay');

function openModal(item){
  state.pendingItem = item;
  state.modalStage = 'intro';
  renderModal();
  modalOverlay.classList.remove('hidden');
}
function closeModal(){
  modalOverlay.classList.add('hidden');
  state.pendingItem = null;
  state.modalStage = 'intro';
}
function renderModal(){
  const item = state.pendingItem;
  if(!item) return;
  const isGlobal = item.id === '__global__';
  if(isGlobal){
    modalThumb.innerHTML = '<div style="font-size:40px;line-height:88px;text-align:center;">💚</div>';
  } else {
    modalThumb.innerHTML = item.cat==='bg' ? `<div class="bg-swatch ${item.bgClass||'bg-forest'}" style="width:100%;height:100%;border-radius:16px;"></div>` : (item.svg || '<div class="upload-placeholder">➕</div>');
  }
  modalTitle.textContent = isGlobal ? '마음 전하기' : item.name;
  modalPrice.textContent = '24시간 전체 이용권';

  if(state.modalStage === 'intro'){
    modalDesc.textContent = '마음을 전하면 24시간 동안 모든 아이템을 자유롭게 꾸며볼 수 있어요. 후원 페이지에서 마음을 전한 뒤 돌아와 확인해주세요.';
    modalCancelBtn.textContent = '다음에요';
    modalCancelBtn.onclick = closeModal;
    modalConfirmBtn.textContent = '후원 페이지 열기';
    modalConfirmBtn.onclick = ()=>{
      window.open(DONATION_URL, '_blank', 'noopener');
      state.modalStage = 'confirm';
      renderModal();
    };
  } else {
    modalDesc.textContent = '후원 페이지에서 마음을 전하셨나요? 완료하셨다면 아래 버튼을 눌러 모든 아이템을 열어주세요.';
    modalCancelBtn.textContent = '아직이에요';
    modalCancelBtn.onclick = closeModal;
    modalConfirmBtn.textContent = '네, 마음 전했어요';
    modalConfirmBtn.onclick = finalizeUnlock;
  }
}
function finalizeUnlock(){
  const item = state.pendingItem;
  if(!item) return;
  activateDonation();
  updateDonationBadge();
  closeModal();
  if(item.id === '__global__'){
    renderStage();
    renderGrid();
    playCelebration();
    showToast(pickQuote(THANK_QUOTES));
    return;
  }
  if(item.isCustomSlot){
    triggerCustomUpload(item);
    renderGrid();
    return;
  }
  if(item.cat==='bg'){ state.bg = item.id; }
  else { state.equipped[item.cat] = item.id; }
  renderStage();
  renderGrid();
  playCelebration();
  showToast(pickQuote(THANK_QUOTES));
}

/* ---------- toast ---------- */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 4500);
}

/* ---------- spin (turn to back / turn to front) ---------- */
spinBtn.onclick = ()=>{
  if(stage.classList.contains('spinning')) return;
  const goingBack = state.facing === 'front';
  stage.classList.add('spinning','overlays-hidden');
  const seq = goingBack ? [IMAGES.threequarter, IMAGES.side] : [IMAGES.threequarter, IMAGES.front];
  let i=0;
  const iv = setInterval(()=>{
    charImg.src = seq[i];
    i++;
    if(i>=seq.length){
      clearInterval(iv);
      state.facing = goingBack ? 'back' : 'front';
      stage.classList.remove('spinning','overlays-hidden');
      renderStage();
      updateSpinBtnLabel();
    }
  }, 170);
};

/* ---------- share / download ---------- */
function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function svgToUrl(svgStr){
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
}
function drawBgFallback(ctx,W,H,cls){
  let grad = null;
  if(cls==='bg-forest'){ grad=ctx.createLinearGradient(0,H,0,0); grad.addColorStop(0,'#bcdb95'); grad.addColorStop(0.55,'#cfe6ab'); grad.addColorStop(1,'#dcecc2'); }
  else if(cls==='bg-sunset'){ grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#ffd9a0'); grad.addColorStop(0.45,'#ffb98c'); grad.addColorStop(1,'#f28f82'); }
  else if(cls==='bg-space'){ grad=ctx.createLinearGradient(0,H,0,0); grad.addColorStop(0,'#2c2150'); grad.addColorStop(0.55,'#1a1440'); grad.addColorStop(1,'#0c0a24'); }
  if(grad){ ctx.fillStyle=grad; } else { ctx.fillStyle='#002b4b'; }
  ctx.fillRect(0,0,W,H);

  if(cls==='bg-fireflynight'){
    [{left:90,top:9,size:19},{left:7,top:14,size:12},{left:4,top:52,size:10},{left:12,top:90,size:14},{left:88,top:90,size:14}].forEach(f=>{
      const cx=f.left/100*W, cy=f.top/100*H, r=f.size/100*W/2;
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,'rgba(255,250,170,1)'); g.addColorStop(0.2,'rgba(223,220,20,0.95)');
      g.addColorStop(0.45,'rgba(223,220,20,0.4)'); g.addColorStop(1,'rgba(223,220,20,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    });
  } else if(cls==='bg-space'){
    for(let i=0;i<16;i++){
      const x=Math.random()*W, y=Math.random()*H*0.85, r=1.5+Math.random()*2;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
  } else if(cls==='bg-forest'){
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(W*0.18,H*0.13,W*0.13,H*0.05,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W*0.62,H*0.2,W*0.09,H*0.035,0,0,Math.PI*2); ctx.fill();
  } else if(cls==='bg-sunset'){
    const cx=W*0.5, cy=H*0.25, r=W*0.17;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'#fff6d8'); g.addColorStop(0.6,'#ffd873'); g.addColorStop(1,'rgba(255,216,115,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
}

async function composeShareImage(){
  const W=1042, H=992;
  const canvas = document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');

  const bgItem = itemById(state.bg);
  if(bgItem.isCustomSlot && bgItem.customBgUrl){
    const img = await loadImage(bgItem.customBgUrl);
    const scale = Math.max(W/img.width, H/img.height);
    const w=img.width*scale, h=img.height*scale;
    ctx.drawImage(img, (W-w)/2, (H-h)/2, w, h);
  } else {
    drawBgFallback(ctx, W, H, bgItem.bgClass);
  }

  const charSrc = state.facing === 'front' ? IMAGES.front : IMAGES.side;
  const charImgEl = await loadImage(charSrc);
  ctx.drawImage(charImgEl, 0, 0, W, H);

  for(const cat of Object.keys(state.equipped)){
    const id = state.equipped[cat];
    if(!id) continue;
    if(facingIsBack() && (cat==='glasses' || cat==='neck')) continue;
    const item = itemById(id);
    let img;
    try{
      img = item.customImg ? await loadImage(item.customImg) : await loadImage(svgToUrl(item.svg));
    }catch(e){ continue; }
    const w = parseFloat(item.style.width)/100*W;
    const h = w * (img.naturalHeight/img.naturalWidth || 1);
    const cx = parseFloat(item.style.left)/100*W;
    const cy = parseFloat(item.style.top)/100*H;
    ctx.drawImage(img, cx-w/2, cy-h/2, w, h);
  }

  return new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
}

document.getElementById('shareBtn').onclick = async ()=>{
  const btn = document.getElementById('shareBtn');
  if(btn.disabled) return;
  btn.disabled = true;
  showToast('이미지를 만드는 중이에요...');
  try{
    const blob = await composeShareImage();
    const url = URL.createObjectURL(blob);

    // try the claude.ai artifact-only native save first (no-op everywhere else)
    let dl = null;
    try{
      if(window.claude && window.claude.use){ dl = await window.claude.use('downloads'); }
    }catch(e){ dl = null; }
    if(dl){
      try{
        await dl.save({ filename:'맹그린_꾸미기.png', data: blob });
        showToast('이미지를 저장했어요! 🌱');
        btn.disabled = false;
        return;
      }catch(err){
        if(err && err.code==='declined'){ showToast('저장을 취소했어요'); btn.disabled = false; return; }
        // fall through to the universal lightbox on any other error
      }
    }

    // universal fallback: show the image in-page (works even inside
    // in-app browsers like KakaoTalk that block window.open popups)
    const shareImg = document.getElementById('shareImg');
    shareImg.src = url;
    document.getElementById('shareOverlay').classList.remove('hidden');
    document.getElementById('shareDownloadBtn').onclick = ()=>{
      try{
        const a = document.createElement('a');
        a.href = url;
        a.download = '맹그린_꾸미기.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }catch(e){
        showToast('길게 눌러서 저장해주세요');
      }
    };
  }catch(e){
    showToast('이미지를 만들지 못했어요');
  }
  btn.disabled = false;
};
document.getElementById('shareCloseBtn').onclick = ()=>{
  document.getElementById('shareOverlay').classList.add('hidden');
};

/* ---------- reset ---------- */
document.getElementById('resetBtn').onclick = ()=>{
  state.equipped = { glasses:null, neck:null, head:null, prop:null };
  state.facing = 'front';
  updateSpinBtnLabel();
  renderStage();
  renderGrid();
  showToast('처음 모습으로 돌아왔어요');
};

renderTabs();
renderGrid();
renderStage();

updateSpinBtnLabel();
setInterval(updateDonationBadge, 60000);
